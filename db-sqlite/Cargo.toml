[package]
name = "db-sqlite"
edition = "2021"
description = "A concrete implementation of the Trust database using sqlite"

version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "db_sqlite"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
model = { package = "trust-model", path = "../model", version = "0.3.2" }


rust_decimal = {workspace = true}
rust_decimal_macros = {workspace = true}
diesel = {workspace = true}
diesel_migrations = {workspace = true}
chrono = {workspace = true}
uuid =  {workspace = true}
tracing =  {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
trust-security.workspace = true
zeroize.workspace = true
# Service builds unify Diesel/rusqlite on the verified native SQLCipher build.
# The standalone legacy/HTTP CLI retains its existing system SQLite build.
libsqlite3-sys = { version = "0.38.2", optional = true, features = ["sqlcipher", "bundled_bindings"] }

[features]
encrypted-storage = ["dep:libsqlite3-sys"]

[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"] # Native backend feature unification, no direct FFI calls.
