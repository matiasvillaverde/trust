[advisories]
# rust_decimal declares rkyv 0.7 as an optional compatibility feature. Trust never enables that
# feature (`cargo tree --target all -i rkyv` is empty), but Cargo records optional dependencies in
# Cargo.lock and cargo-audit therefore reports RUSTSEC-2026-0235. Keep this narrow exception until
# rust_decimal removes or upgrades its optional rkyv 0.7 integration. Do not enable rust_decimal's
# `rkyv` or `rkyv-safe` features while this exception exists.
ignore = ["RUSTSEC-2026-0235"]
