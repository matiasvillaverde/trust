[package]
name = "broker-sync"
version = { workspace = true }
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
rust_decimal = { version = "1.43.0", features = ["serde"] }
rust_decimal_macros = "1.40.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
rand = "0.10.3"

[dev-dependencies]
proptest = "1.12.0"
