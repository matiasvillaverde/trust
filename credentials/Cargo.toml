[package]
name = "trust-credentials"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Native credential-store selection for local Trust adapters"

[dependencies]
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-openssl"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
