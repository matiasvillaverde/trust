name: Rust CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel redundant builds on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_MACHETE_VERSION: "0.9.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  RUST_TEST_THREADS: 1

jobs:
  # Quick checks run first for fast feedback
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Test release version validation
      run: bash .github/test_version_parsing.sh

    - name: Quick compilation check
      run: cargo check --locked --workspace --all-features

  # Enhanced lint job with security tools
  lint:
    name: Enhanced Clippy & Security
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1
        components: clippy

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-enhanced-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-enhanced-
          ${{ runner.os }}-cargo-

    - name: Cache cargo tools binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: tools-cache
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-machete
        key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}

    - name: Install cargo-deny
      if: steps.tools-cache.outputs.cache-hit != 'true'
      run: cargo install cargo-deny --version "${{ env.CARGO_DENY_VERSION }}" --locked

    - name: Install cargo-machete
      if: steps.tools-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.cargo/bin
        cargo install cargo-machete --version ${{ env.CARGO_MACHETE_VERSION }} --locked

    - name: Run enhanced clippy with complexity analysis
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run dependency security and license checks
      run: cargo deny --all-features check

    - name: Check for unused dependencies
      run: cargo machete --with-metadata --skip-target-dir

    - name: Verify reliability inventory and evidence parser
      run: python3 -m unittest discover -s scripts -p test_reliability.py

  # Combined build and test job for efficiency
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    # Run in parallel with lint job
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Test (all features)"
            cmd: "cargo test --locked --all-features --workspace"
          - name: "Test (no features)"
            cmd: "cargo test --locked --no-default-features --workspace"
          - name: "Doc tests"
            cmd: "cargo test --locked --doc"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build workspace
      run: |
        cargo build --locked --workspace --all-features
        cargo build --locked --workspace --no-default-features

    - name: ${{ matrix.name }}
      run: ${{ matrix.cmd }}

  snapshot-contracts:
    name: Snapshot Contracts
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1

    - name: Verify report JSON snapshots (no updates)
      run: cargo test --locked -p trust-cli --features legacy-cli --test integration_test_report_json_snapshots

  coverage:
    name: Coverage Baseline Gate
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --version "${{ env.CARGO_LLVM_COV_VERSION }}" --locked

    - name: Enforce baseline coverage (no regressions)
      run: |
        cargo llvm-cov \
          --workspace \
          --all-features \
          --locked \
          --ignore-filename-regex '(^|/)test_support\.rs$' \
          --fail-under-lines 94 \
          --fail-under-functions 90 \
          --fail-under-regions 93

  # Explicit regression coverage for the CLI integration use-cases suite.
  # This guarantees the large bug-hunt tests run in every PR CI cycle.
  cli-integration-use-cases:
    name: CLI Integration Use Cases
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-cli-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-cli-integration-
          ${{ runner.os }}-cargo-

    - name: Run CLI integration use-case suite
      run: cargo test --locked -p trust-cli --test integration_test_use_cases

  trust-proof:
    name: Multi-Asset Risk Proof
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-trust-proof-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-trust-proof-
          ${{ runner.os }}-cargo-

    - name: Run focused multi-asset risk and IBKR proof suite
      run: make trust-proof

  # Release build verification
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    # Run in parallel with other jobs
    needs: quick-checks
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev libsqlite3-dev build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-
          ${{ runner.os }}-cargo-

    - name: Build all crates in release mode
      run: |
        # Build all at once for better parallelism
        cargo build --locked --release --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
      with:
        toolchain: 1.99.1
    - name: Install auditor
      run: cargo install cargo-audit --version "${{ env.CARGO_AUDIT_VERSION }}" --locked
    - name: Reject vulnerable, unsound, unmaintained, or yanked dependencies
      run: cargo audit --deny warnings

  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build production image
      run: docker build --pull -t trust-service:ci .
    - name: Scan production packages
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.76.1
        image-ref: trust-service:ci
        scanners: vuln
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: false

  # Summary job to ensure all checks pass
  ci-success:
    name: CI Success
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [quick-checks, lint, build-and-test, snapshot-contracts, coverage, cli-integration-use-cases, trust-proof, release-build, audit, container-security]
    steps:
    - name: CI Success
      env:
        ALL_JOBS_SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
      run: |
        test "$ALL_JOBS_SUCCEEDED" = true
        echo "All CI checks passed successfully!"
