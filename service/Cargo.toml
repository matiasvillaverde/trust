[package]
name = "trust-service"
default-run = "trust-service"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Authenticated risk-management service and MCP interface for Trust"

[dependencies]
schemars.workspace = true
trust-core = { package = "core", path = "../core", version = "0.3.5" }
model = { package = "trust-model", path = "../model", version = "0.3.5" }
db-sqlite = { path = "../db-sqlite", version = "0.3.5", features = ["encrypted-storage"] }
ibkr-broker = { path = "../ibkr-broker", version = "0.3.5" }
alpaca-broker = { path = "../alpaca-broker", version = "0.3.5" }
advisor = { path = "../advisor", version = "0.3.5" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
axum = "0.8.9"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower = { version = "0.5.3", features = ["util", "limit"] }
tower-http = { version = "0.7.1", features = ["limit", "set-header"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# Diesel 2.3 requires libsqlite3-sys <0.39; rusqlite 0.41 requires 0.39.
rusqlite = { version = "0.40.2", default-features = false, features = ["backup"] }
fs2 = "0.4.3"
url = "2.5.8"
trust-security.workspace = true
zeroize.workspace = true

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
reqwest.workspace = true
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tempfile = "3.27.0"
openssl = "0.10.81"
base64 = "0.23.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
