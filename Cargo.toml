[workspace]
members = [
    "model",
    "db-sqlite",
    "core",
    "cli",
    "alpaca-broker",
    "ibkr-broker",
    "broker-sync",
    "advisor",
    "service",
    "credentials",
    "security",
]
resolver = "2"

[workspace.package]
version = "0.3.5"
authors = ["Matias Villaverde <matiasvillaverde@protonmail.com>"]
rust-version = "1.99.1"
license = "GPL-3.0-only"
repository = "https://github.com/matiasvillaverde/trust"
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.14", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono"] }
diesel_migrations = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = [
    "serde",
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
] }
clap = { version = "4.6.7", features = ["derive"] }
tabled = { version = "0.22.0" }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
tracing = "0.1.44"
sha2 = "0.11.1"
# NOTE: apca uses GPL-3.0 license. Consider alternatives if license compatibility becomes an issue.
apca = "0.31.0"
num-decimal = { version = "0.2.5", default-features = false }
# USING: rust_decimal (MIT/Apache-2.0) instead of num-decimal for consistency
tokio = {version = "1.54.1", default-features = false, features = ["net", "rt-multi-thread", "macros"]}
futures-util = "0.3.34"
shellexpand = "3.1.2"
trust-credentials = { path = "credentials", version = "0.3.5" }
trust-security = { path = "security", version = "0.3.5" }
zeroize = "1.9.1"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
schemars = { version = "1.2.3", features = ["chrono04", "uuid1", "rust_decimal1"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "json", "query", "native-tls"] }
argon2 = "0.6.0"
password-hash = "0.6.1"
